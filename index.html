<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>WebGPU Deferred Renderer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #6f6;
        font-size: 12px;
        line-height: 1.45;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 10px;
        border-radius: 8px;
        white-space: pre;
        pointer-events: none;
        text-shadow: 0 0 2px #000;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        color: #f66;
        background: #100;
        font-size: 16px;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">initializing WebGPU…</div>
    <div id="err"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
